<div class="card"><div class="row"><h3 class="grow">${_('Resumen','Laburpena')}</h3>${S(sm)}</div><p>🤝 ${svc({c:w.cat,o:w.opt,t:w.txt})}</p><p>📅 ${fd(w.date)} · ${w.time}</p><p>⏱️ ${w.h} h · 📍 ${esc(w.addr)}</p><p>${fmt(p.b)}${p.d?` − ${fmt(p.x)} (${p.d*100} %)`:''}</p><p style="font-size:1.5rem"><b>${_('Total','Guztira')}: ${fmt(p.tot)}</b></p></div>`}
return`<div class="row" style="justify-content:space-between">${back()}<b>${_('Paso','Urratsa')} ${w.s} ${_('de','/')} 4</b>${S(`${_('Paso','Urratsa')} ${w.s} ${_('de','/')} 4`)}</div><div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="${w.s}" style="margin:.6rem 0"><i style="width:${w.s*25}%"></i></div>${h}
<div class="row" style="justify-content:space-between;margin-top:1rem">${w.s>1?`<button class="btn g" data-a="pv">← ${_('Anterior','Aurrekoa')}</button>`:'<span></span>'}${w.s<4?`<button class="btn" id="nx" data-a="nx" ${ok()?'':'disabled'}>${_('Siguiente','Hurrengoa')} →</button>`:`<button class="btn s" data-a="ok">✅ ${_('Confirmar solicitud','Eskaera baieztatu')}</button>`}</div>`}

function reqs(){return back()+head(_('Mis solicitudes','Nire eskaerak'))+(db.reqs.length?db.reqs.map(r=>{const s=ST[r.st][L()],t=`${svc(r)}. ${fd(r.date)}, ${r.time}. ${s}`,x=tr[r.id]||{};let e='';
if(r.st=='done'){if(r.rate)e=`<p><span class="star" style="cursor:default">${stars(r.rate.s)}</span> ${esc(r.rate.c)}</p>`;else if(dl(r)<=0)e=`<p class="mut">⌛ ${_('El plazo de 24 horas para valorar ha terminado.','Baloratzeko 24 orduko epea amaitu da.')}</p>`;
else e=`<div class="card" style="background:var(--sb)"><div class="row"><b class="grow">⭐ ${_('Valora a','Baloratu')} ${esc(r.w)} · ${_('te quedan','geratzen zaizkizu')} ${dl(r)} h</b>${S(_('Valora el servicio con estrellas','Baloratu zerbitzua izarrekin'))}</div>${[1,2,3,4,5].map(n=>`<button class="star" data-a="star" data-id="${r.id}" data-v="${n}" aria-label="${n}">${n<=(x.s||0)?'★':'☆'}</button>`).join('')}<textarea rows="2" data-f="tr.${r.id}.c" placeholder="${_('Escribe un comentario','Idatzi iruzkin bat')}">${esc(x.c||'')}</textarea><button class="btn" style="margin-top:.5rem" data-a="rate" data-id="${r.id}">${_('Enviar valoración','Balorazioa bidali')}</button></div>`}
return`<article class="card"><div class="row"><h3 class="grow">${svc(r)}</h3>${S(t)}</div><p>📅 ${fd(r.date)} · ${r.time} · ${r.h} h · ${fmt(r.tot)}</p><p>📍 ${esc(r.addr)}</p><p><span class="bd">${s}</span> ${r.w?'· 👤 '+esc(r.w):''}</p>
<button class="btn s" data-a="wa" data-id="${r.id}">💬 ${_('Avisar a mi familiar por WhatsApp','Abisatu nire senideari WhatsApp bidez')}</button>${e}</article>`}).join(''):`<div class="card"><p>${_('Aún no tienes solicitudes.','Oraindik ez duzu eskaerarik.')}</p><a class="btn" href="#help" data-a="go" data-v="help">${_('Pedir ayuda','Laguntza eskatu')}</a></div>`)}

const msgs=(a,me)=>`<div class="msgs">${a.map(m=>`<div class="m ${m.n==me||m.f=='u'?'me':''}"><div>${m.n?`<b>${esc(m.n)}:</b> `:''}${esc(m.t)}</div>${S((m.n?m.n+': ':'')+m.t)}</div>`).join('')}</div>`;
const sendBox=v=>`<div class="send"><input aria-label="${_('Escribe un mensaje','Idatzi mezu bat')}" placeholder="${_('Escribe un mensaje','Idatzi mezu bat')}"><button class="btn" data-a="send" data-v="${v}">${_('Enviar','Bidali')}</button></div>`;
function plan(p){const c=p.m.length,d=c>=3?20:c==2?15:0,me=p.m.includes(fn()),full=c>=p.max&&!me,tt=p.t[L()],wh=p.when[L()];
return`<article class="card"><div class="row"><h3 class="grow">${tt}</h3>${S(`${tt}. ${wh}. ${c} ${_('de','/')} ${p.max} ${_('plazas','leku')}`)}</div><p>📅 ${wh} · ${p.h} h</p><p>👥 ${c}/${p.max} · ${_('quedan','geratzen dira')} ${p.max-c}</p><p><span class="bd">${d?`−${d} %`:_('Descuento desde 2 personas','Deskontua 2 pertsonatik')}</span> ${fmt(pr(p.h,c).tot)}/${_('persona','pertsona')}</p><p class="mut">${_('Participan','Parte-hartzaileak')}: ${p.m.map(esc).join(', ')}</p>
<div class="row"><button class="btn ${me?'g':'s'}" data-a="join" data-v="${p.id}" ${full?'disabled':''}>${me?_('Salir del plan','Planetik atera'):full?_('Completo','Beteta'):_('Unirme al plan','Planera batu')}</button><button class="btn g" data-a="pchat" data-v="${p.id}">💬 ${_('Chat de grupo','Talde-txata')}</button></div>${oc==p.id?msgs(p.msgs,fn())+sendBox('p'+p.id):''}</article>`}
function comm(){let h=back()+head(_('Comunidad y planes','Komunitatea eta planak'))+`<div class="tabs" role="tablist">${[['neigh',_('Vecinos del barrio · Seguir a gente','Auzokideak · Jarraitu jendea')],['plans',_('Planes conjuntos','Plan bateratuak')]].map(t=>`<button class="btn ${ct==t[0]?'':'g'}" role="tab" aria-selected="${ct==t[0]}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;
if(ct=='neigh')h+=`<div class="grid">${N.map(n=>{const f=db.fol.includes(n.n),t=`${n.n}, ${n.b}. ${_('Intereses en común','Interes komunak')}: ${n.i.map(i=>i[L()]).join(', ')}`;return`<article class="card"><div class="row"><h3 class="grow">👤 ${n.n}</h3>${S(t)}</div><p>📍 ${n.b}</p><p>${_('Intereses en común','Interes komunak')}: ${n.i.map(i=>`<span class="bd">${i[L()]}</span>`).join(' ')}</p><button class="btn ${f?'g':'s'}" aria-pressed="${f}" data-a="fol" data-v="${n.n}">${f?'✓ '+_('Siguiendo','Jarraitzen'):'+ '+_('Seguir','Jarraitu')}</button></article>`}).join('')}</div>`;
else{const ps=fl?db.plans.filter(p=>p.m.some(m=>db.fol.some(f=>f.startsWith(m)))):db.plans;h+=`<button class="opt ${fl?'on':''}" aria-pressed="${fl}" data-a="flt">${fl?'✓ ':''}${_('Solo planes de gente que sigo','Jarraitzen dudan jendearen planak bakarrik')}</button>`+(ps.length?ps.map(plan).join(''):`<div class="card"><p>${_('Ningún plan de la gente que sigues. Sigue a más vecinos.','Jarraitzen duzun jendearen planik ez. Jarraitu auzokide gehiago.')}</p></div>`)}
return h}

function prof(){const u=db.u,f=(k,l,ty)=>`<label for="f${k}">${l}</label><div class="row"><input class="grow" id="f${k}" type="${k=='pass'&&!sp?'password':ty||'text'}" data-f="db.u.${k}" value="${esc(u[k])}">${k=='pass'?`<button class="ib" data-a="pw">${sp?_('Ocultar','Ezkutatu'):_('Mostrar','Erakutsi')}</button>`:''}${S(l)}</div>`;
const flds=f('name',_('Nombre completo','Izen osoa'))+f('user',_('Nombre de usuario (ej. @aimar_bilbao)','Erabiltzaile-izena (adib. @aimar_bilbao)'))+f('contact',_('Correo electrónico o teléfono','Posta elektronikoa edo telefonoa'))+f('pass',_('Contraseña','Pasahitza'))+f('addr',_('Barrio o dirección en Bilbao','Auzoa edo helbidea Bilbon'))+f('fam',_('Teléfono del familiar de confianza (WhatsApp)','Konfiantzazko senidearen telefonoa (WhatsApp)'),'tel');
let h=back()+head(_('Mi perfil / Cuenta','Nire profila / Kontua'));
if(u.on)return h+`<div class="card">${flds}<div class="row" style="margin-top:1rem"><button class="btn s" data-a="prof">${_('Guardar datos','Datuak gorde')}</button><button class="btn g" data-a="out">${_('Cerrar sesión','Saioa itxi')}</button></div></div>`;
return h+`<div class="tabs">${[['create',_('Crear cuenta','Kontua sortu')],['login',_('Iniciar sesión','Saioa hasi')]].map(t=>`<button class="btn ${pm==t[0]?'':'g'}" data-a="mode" data-v="${t[0]}">${t[1]}</button>`).join('')}</div><div class="card">${pm=='create'?flds+`<button class="btn s" style="margin-top:1rem" data-a="auth" data-v="c">${_('Crear cuenta','Kontua sortu')}</button>`:`<label for="lu">${_('Usuario o correo/teléfono','Erabiltzailea edo posta/telefonoa')}</label><input id="lu" data-f="lg.u"><label for="lp">${_('Contraseña','Pasahitza')}</label><input id="lp" type="password" data-f="lg.p"><button class="btn s" style="margin-top:1rem" data-a="auth" data-v="l">${_('Iniciar sesión','Saioa hasi')}</button>`}</div>`}

function admin(){const sel=(r,k,o)=>`<select data-a="adm" data-k="${k}" data-id="${r.id}" aria-label="${k}">${o.map(x=>`<option value="${x[0]}" ${r[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
return back()+`<h2>🔧 Admin</h2>`+db.reqs.map(r=>`<div class="card"><b>${svc(r)}</b><p>${fd(r.date)} · ${r.time} · ${r.h} h · ${esc(r.addr)}</p><div class="grid"><div><label>${_('Acompañante','Laguntzailea')}</label>${sel(r,'w',[['','—'],...W.map(x=>[x,x])])}</div><div><label>${_('Estado','Egoera')}</label>${sel(r,'st',Object.keys(ST).map(k=>[k,ST[k][L()]]))}</div></div></div>`).join('')
+`<div class="card"><h3>⭐ ${_('Valoraciones','Balorazioak')}</h3>${W.map(n=>{const a=db.reqs.filter(r=>r.w==n&&r.rate),m=a.length?a.reduce((s,r)=>s+r.rate.s,0)/a.length:0;return`<p><b>${n}</b>: ${a.length?`${stars(Math.round(m))} ${m.toFixed(1).replace('.',',')} (${a.length})`:_('Sin valoraciones','Balorazio gabe')}</p>${a.map(r=>`<p class="mut">“${esc(r.rate.c)||'—'}”</p>`).join('')}`}).join('')}</div><button class="btn g" data-a="rst">${_('Restablecer datos de muestra','Lagin-datuak berrezarri')}</button>`}

function modal(){if(!md)return'';let b='';
if(md=='sos'){const m=encodeURIComponent(`🆘 URGENTE: ${db.u.name} necesita ayuda. Dirección: ${db.u.addr||'Bilbao'}. Hurbil 644 270 017`);
b=`<div class="row"><h2 class="grow" style="color:var(--r)">🆘 ${_('Emergencia','Larrialdia')}</h2>${S(_('Ayuda inmediata. Pulsa llamar al 644 270 017.','Berehalako laguntza. Sakatu 644 270 017 zenbakira deitzeko.'))}</div><p><b>${_('Si es muy grave, llama también al 112.','Oso larria bada, deitu 112ra ere.')}</b></p><div class="row" style="flex-direction:column;align-items:stretch"><a class="btn" href="tel:644270017">📞 ${_('Llamar a Hurbil','Hurbilera deitu')} · 644 270 017</a><a class="btn s" target="_blank" rel="noopener" href="https://wa.me/${phone(db.u.fam)||''}?text=${m}">💬 ${_('Avisar a mi familiar por WhatsApp','Abisatu nire senideari WhatsApp bidez')}</a><a class="btn g" target="_blank" rel="noopener" href="https://wa.me/34644270017?text=${m}">🚨 ${_('Enviar alerta urgente con mi dirección','Bidali larrialdi-alerta nire helbidearekin')}</a></div><p class="mut">📍 ${esc(db.u.addr||'Bilbao')}</p>`}
else b=`<div class="row"><h2 class="grow">💬 ${_('Chat de ayuda','Laguntza-txata')}</h2>${S(_('Chat de ayuda con el equipo de Hurbil','Hurbilen taldearekin laguntza-txata'))}</div><div class="tabs">${[['team',_('Equipo Hurbil','Hurbil taldea')],['plans',_('Planes y acompañantes','Planak eta laguntzaileak')]].map(t=>`<button class="btn ${mt==t[0]?'':'g'}" data-a="tm" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`+(mt=='team'?msgs(db.team,'')+sendBox('team'):db.plans.map(p=>`<div class="row" style="margin:.4rem 0"><button class="opt" data-a="gop" data-v="${p.id}">💬 ${p.t[L()]}</button>${S(p.t[L()])}</div>`).join(''));
return`<div class="ov"><div class="mo" role="dialog" aria-modal="true">${b}<button class="btn g" style="margin-top:1rem" data-a="close">✕ ${_('Cerrar','Itxi')}</button></div></div>`}

function render(){const h=route,pg={help,reqs,comm,prof,admin}[h]||home;
document.documentElement.lang=db.lang;document.body.className=(db.hc?'hc ':'')+(db.easy?'easy':'');document.documentElement.style.fontSize=(16+db.fs*2+(db.easy?4:0))+'px';
$('#hd').innerHTML=hdr();$('#app').innerHTML=pg()+(h?'':'')+`<footer class="adv" style="margin-top:2rem;text-align:center"><small>Hurbil · Bilbao · 644 270 017 · <a href="#admin" data-a="go" data-v="admin" style="opacity:.6">admin</a></small></footer>`;$('#md').innerHTML=modal();
document.querySelectorAll('.msgs').forEach(e=>e.scrollTop=e.scrollHeight);if(fo){const i=document.querySelector('.send input');i&&i.focus();fo=false}}

function act(el){const a=el.dataset.a,v=el.dataset.v,id=+el.dataset.id,r=db.reqs.find(x=>x.id==id);
switch(a){
case'say':say(el.dataset.t);return;
case'lang':db.lang=v;break;case'fs':db.fs=Math.max(-1,Math.min(6,db.fs+ +v));break;case'hc':db.hc^=1;break;case'easy':db.easy^=1;break;
case'md':md=v;break;case'close':md=null;break;case'go':go(v);break;case'tm':mt=v;break;
case'cat':w.cat=+v;w.opt=null;w.txt='';break;case'opt':w.opt=v=='o'?'o':+v;if(v!='o')w.txt='';break;
case'q':if(el.dataset.k=='d')w.date=d0(+v);else w.time=v;break;
case'hr':w.h=+v;break;case'ppl':w.ppl=+v;break;case'nx':w.s++;break;case'pv':w.s--;break;
case'ok':{if(db.reqs.some(x=>x.st!='done'&&x.date==w.date&&x.time==w.time)){toast(_('Ya tienes un servicio a esa hora. Elige otra hora.','Ordu horretan zerbitzu bat duzu jada. Aukeratu beste ordu bat.'));w.s=2;break}
db.reqs.unshift({id:Date.now(),c:w.cat,o:w.opt,t:w.txt,date:w.date,time:w.time,h:w.h,addr:w.addr,ppl:w.ppl,tot:pr(w.h,w.ppl).tot,st:'pending',w:''});if(!db.u.addr)db.u.addr=w.addr;Object.assign(w,W0());toast(_('¡Solicitud confirmada! Te asignaremos un acompañante.','Eskaera baieztatu da! Laguntzaile bat esleituko dizugu.'));go('reqs');break}
case'wa':{const p=phone(db.u.fam);if(!p){toast(_('Añade el teléfono de tu familiar en el perfil.','Gehitu zure senidearen telefonoa profilean.'));go('prof');render();return}
open(`https://wa.me/${p}?text=${encodeURIComponent(`Hola, te aviso de mi cita con Hurbil: ${svc(r)}. ${fd(r.date)} a las ${r.time}, en ${r.addr}. Estado: ${ST[r.st][0]}. Hurbil: 644 270 017`)}`,'_blank','noopener');return}
case'star':tr[id]={...tr[id],s:+v};break;
case'rate':{const x=tr[id];if(!x?.s){toast(_('Elige de 1 a 5 estrellas.','Aukeratu 1 eta 5 izar artean.'));return}if(dl(r)<=0){toast(_('El plazo de 24 horas ha terminado.','24 orduko epea amaitu da.'));break}r.rate={s:x.s,c:x.c||''};break}
case'fol':db.fol=db.fol.includes(v)?db.fol.filter(x=>x!=v):[...db.fol,v];break;
case'tab':ct=v;break;case'flt':fl=!fl;break;
case'join':{const p=db.plans.find(x=>x.id==+v),n=fn();p.m=p.m.includes(n)?p.m.filter(x=>x!=n):[...p.m,n];break}
case'pchat':oc=oc==+v?null:+v;break;
case'gop':md=null;ct='plans';oc=+v;go('comm');break;
case'send':{const t=el.parentElement.querySelector('input').value.trim();if(!t)return;fo=true;
if(v=='team'){db.team.push({f:'u',t});setTimeout(()=>{db.team.push({f:'h',t:'Gracias por escribirnos. Te responderemos enseguida o te llamamos al número que nos has dado.'});save();render()},900)}
else db.plans.find(x=>x.id==+v.slice(1)).msgs.push({n:fn(),t});break}
case'pw':sp=!sp;break;case'mode':pm=v;break;case'prof':toast(_('Datos guardados.','Datuak gordeta.'));break;
case'auth':if(v=='c'){if(!db.u.user||!db.u.pass||!db.u.name){toast(_('Rellena nombre, usuario y contraseña.','Bete izena, erabiltzailea eta pasahitza.'));return}db.u.on=1}
else{if((lg.u==db.u.user||lg.u==db.u.contact)&&lg.p==db.u.pass)db.u.on=1;else{toast(_('Usuario o contraseña incorrectos.','Erabiltzaile edo pasahitz okerra.'));return}}break;
case'out':db.u.on=0;break;
case'adm':{r[el.dataset.k]=el.value;if(el.dataset.k=='st'&&el.value=='done'&&!r.doneAt)r.doneAt=Date.now();break}
case'rst':db=seed();break}
save();render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(e.target.classList.contains('ov')){md=null;render();return}if(el&&el.tagName!='SELECT'){if(el.dataset.a=='go')e.preventDefault();act(el)}});
document.addEventListener('change',e=>{if(e.target.tagName=='SELECT'&&e.target.dataset.a)act(e.target)});
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const k=f.split('.');let o=X[k[0]];for(const p of k.slice(1,-1))o=o[p]??={};o[k[k.length-1]]=e.target.value;save();if(k[0]=='w'){const n=$('#nx');if(n)n.disabled=!ok()}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&md){md=null;render()}if(e.key=='Enter'&&e.target.closest('.send')&&e.target.tagName=='INPUT')e.target.parentElement.querySelector('button').click()});
addEventListener('hashchange',()=>{route=location.hash.slice(1)||'home';scrollTo(0,0);render()});render();
</script></body></html>
